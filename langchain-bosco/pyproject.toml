[project]
name = "langchain-bosco"
version = "0.1.0"
description = "LangChain tools for Bosco Labs: counterparty (KYB) checks, a free query planner and official-records tools (company registers, SEC EDGAR, sanctions lists, EU and national law)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bosco Labs", email = "support@boscolabs.dev" }]
requires-python = ">=3.10"
dependencies = ["langchain-core>=0.3.15", "httpx>=0.27"]
keywords = ["langchain", "tools", "agents", "kyb", "sanctions", "company-data", "sec-edgar"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://boscolabs.dev"
Documentation = "https://boscolabs.dev/llms.txt"
API = "https://api.boscolabs.dev/openapi.json"
Repository = "https://github.com/Bosco-Labs/bosco-labs-data/tree/main/langchain-bosco"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
