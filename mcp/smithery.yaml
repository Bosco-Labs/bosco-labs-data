# Smithery registry config (stdio, run locally by the user's client).
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      boscoApiKey:
        type: string
        description: >-
          Your Bosco Labs API key, for the paid tools: every row they return is paid from your
          prepaid credits (from $0.001 to $0.05 per row, see the README). A new key has $5.00
          of free credit, no card: https://boscolabs.dev/api.html#key. The free tools
          (lei_lookup, sec_company_lookup) work without it.
      apifyToken:
        type: string
        description: >-
          Only for Apify users, instead of the key: your Apify API token. The paid tools then
          run as Bosco Labs Apify Actors, billed to your Apify account.
  commandFunction: |-
    (config) => ({
      command: "uvx",
      args: ["bosco-labs-data-mcp"],
      env: { BOSCO_API_KEY: config.boscoApiKey || "", APIFY_TOKEN: config.apifyToken || "" }
    })
  exampleConfig:
    boscoApiKey: bl_live_xxxxxxxxxxxxxxxxxxxx
