# Publishes n8n-nodes-boscolabs/ (the n8n community node) to npm with a provenance statement.
# n8n only verifies community nodes published from GitHub Actions with npm provenance, so this
# workflow is the only way the package is released. `npm run release` is n8n's own path: it runs
# the n8n linter and the build, then `npm publish` with provenance.
#
# Auth, one of:
#   A. First release (the package is not on npm yet, so it has no trusted publisher): a granular
#      npm access token that may publish new packages, stored as the repository secret NPM_TOKEN.
#      Delete the token and the secret afterwards.
#   B. Later releases: npm trusted publishing (GitHub OIDC, no token). On npmjs.com: the package,
#      Settings, Trusted Publisher, GitHub Actions: owner Bosco-Labs, repository bosco-labs-data,
#      workflow filename publish-n8n.yml. Leave NPM_TOKEN unset.
#
# Release: set "version" in n8n-nodes-boscolabs/package.json and VERSION in
# nodes/BoscoLabs/request.ts to the same number on main, then run this workflow by hand or push
# the tag n8n-v<version>.
name: Publish n8n-nodes-boscolabs

on:
  workflow_dispatch: # Actions > Publish n8n-nodes-boscolabs > Run workflow (publishes the version in package.json)
  push:
    tags: ["n8n-v*"] # must equal the version in n8n-nodes-boscolabs/package.json

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance and trusted publishing
      contents: read
    defaults:
      run:
        working-directory: n8n-nodes-boscolabs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: n8n-nodes-boscolabs/package-lock.json
      - name: The tag must equal the package version
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "n8n-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm test # build + offline tests (mocked HTTP), incl. VERSION == package.json
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or later
      - name: Lint, build and publish with provenance
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
