# Publishes the topical MCP Registry entries in mcp/registry/*/server.json (remote-only: each
# points at api.boscolabs.dev/mcp with ?tools= for its topic; the free keyless server is in the main entry).
# Login via GitHub OIDC for the io.github.Bosco-Labs namespace. Bump an entry's version to update it.
name: Publish MCP Registry topical entries

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # MCP Registry login via GitHub OIDC
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Validate every entry
        run: |
          set -euo pipefail
          for d in mcp/registry/*/; do (cd "$d" && mcp-publisher validate); done

      - name: Authenticate to MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish every entry
        run: |
          set -euo pipefail
          for d in mcp/registry/*/; do (cd "$d" && mcp-publisher publish) || echo "::warning::$d not published (already at this version?)"; done
