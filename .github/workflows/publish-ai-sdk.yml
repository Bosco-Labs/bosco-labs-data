# Publishes ai-sdk/ (@bosco_labs/ai-sdk) to npm with trusted publishing (GitHub OIDC, no token).
# One-time setup on npmjs.com, after the first manual publish: package settings -> Trusted
# publisher -> GitHub Actions, organization Bosco-Labs, repository bosco-labs-data, workflow
# publish-ai-sdk.yml.
name: Publish @bosco_labs/ai-sdk

on:
  workflow_dispatch:
  push:
    tags: ["ai-sdk-v*"] # must equal the version in ai-sdk/package.json

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing + provenance
      contents: read
    defaults:
      run:
        working-directory: ai-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm publish --provenance --access public
