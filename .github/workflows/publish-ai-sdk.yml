# Publishes ai-sdk/ (@bosco_labs/ai-sdk) to npm with trusted publishing (GitHub OIDC, no token).
# Trusted publisher set on npmjs.com 2026-11-08 (Bosco-Labs / bosco-labs-data / publish-ai-sdk.yml)
# WITHOUT "Allow npm publish": the workflow stages a version and the owner approves it on npmjs.com.
# shortcut: `npm stage publish` was not yet tested (npm 11.11 lacks it); check it on the next release.
name: Publish @bosco_labs/ai-sdk

on:
  workflow_dispatch:
  push:
    tags: ["ai-sdk-v*"] # must equal the version in ai-sdk/package.json

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing + provenance
      contents: read
    defaults:
      run:
        working-directory: ai-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm install -g npm@latest
      - run: npm stage publish --provenance --access public
